name: CS162 Project1 Userprog
on:
  push:
    branches: [edidada/proj-userprog]
  workflow_dispatch:
jobs:
  arguments:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gcc-multilib clang qemu-system-x86
      - run: |
          set -euo pipefail
          mkdir evidence
          git rev-parse HEAD > evidence/commit.txt
          export PATH="$PWD/src/utils:$PATH"
          chmod +x src/utils/pintos*
          make -C src/utils setitimer-helper
          make -C src/userprog > evidence/build.txt 2>&1
          cd src/userprog/build
          for name in do-nothing args-none args-single args-multiple args-many args-dbl-space stack-align-0 stack-align-1 stack-align-2 stack-align-3 stack-align-4 practice exec-once exec-arg exec-multiple exec-missing exec-bad-ptr wait-simple wait-twice wait-killed wait-bad-pid multi-recurse sc-bad-sp sc-bad-arg sc-boundary sc-boundary-2 sc-boundary-3 halt exit create-normal create-empty create-null create-bad-ptr create-long create-exists create-bound open-normal open-missing open-boundary open-empty open-null open-bad-ptr open-twice close-normal close-twice close-stdin close-stdout close-bad-fd read-normal read-bad-ptr read-boundary read-zero read-stdout read-bad-fd write-normal write-bad-ptr write-boundary write-zero write-stdin write-bad-fd exec-bound exec-bound-2 exec-bound-3 multi-child-fd rox-simple rox-child rox-multichild bad-read bad-write bad-read2 bad-write2 bad-jump bad-jump2 fork-simple fork-nested fork-bad fork-tree fork-file fork-fd fork-offset; do
            make "tests/userprog/$name.result"
            grep -qx PASS "tests/userprog/$name.result"
          done
          make check 2>&1 | tee ../../../evidence/full-suite.txt
          for name in ro-target fork-keep; do
            make "tests/userprog/$name.output"
            perl -I../.. "../../tests/userprog/$name.ck" "tests/userprog/$name" "tests/userprog/$name.result"
            grep -qx PASS "tests/userprog/$name.result"
          done
          pintos -v -k -T 120 --qemu --filesys-size=2 -p tests/userprog/life-parent -a life-parent -p tests/userprog/life-child -a life-child -- -q -f run life-parent > ../../../evidence/lifecycle.txt 2>&1
          grep -q 'LIFECYCLE STRESS PASSED' ../../../evidence/lifecycle.txt
          grep -q 'life-parent: exit(0)' ../../../evidence/lifecycle.txt
          test "$(grep -c 'life-child: exit(9999)' ../../../evidence/lifecycle.txt)" -eq 20
          python3 - <<'PY'
          from pathlib import Path
          import re
          text = Path('../../../evidence/lifecycle.txt').read_text()
          events = [(m.start(), int(m[1])) for m in re.finditer(r'life-child: exit\((\d+)\)', text)]
          parents = [offset for offset, code in events if code not in (73, 9999)]
          leaves = [offset for offset, code in events if code == 9999]
          assert len(parents) == len(leaves) == 20
          assert all(parent < leaf for parent, leaf in zip(parents, leaves))
          print('All 20 middle parents exited before their orphan leaf completed')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: userprog-arguments-evidence
          path: |
            evidence/
            src/userprog/build/tests/**/*.output
            src/userprog/build/tests/**/*.result
