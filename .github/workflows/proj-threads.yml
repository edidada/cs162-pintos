name: CS162 Project2 Threads
on:
  push:
    branches: [edidada/proj-threads]
  workflow_dispatch:
jobs:
  user-threads:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        policy: [fifo, prio]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gcc-multilib clang qemu-system-x86
      - run: |
          set -euo pipefail
          mkdir evidence
          git rev-parse HEAD > evidence/commit.txt
          export PATH="$PWD/src/utils:$PATH"
          chmod +x src/utils/pintos*
          make -C src/utils setitimer-helper
          make -C src/threads > evidence/build.txt 2>&1
          python3 - <<'PY' > evidence/selected-tests.txt
          from pathlib import Path
          for line in Path('src/tests/userprog/multithreading/Make.tests').read_text().splitlines():
              if line.startswith('tests/userprog/multithreading_TESTS '):
                  print(line.split('=', 1)[1].strip())
          PY
          cd src/threads/build
          while read -r target; do
            make KERNELFLAGS="-sched=${{ matrix.policy }}" "$target.result"
            grep -qx PASS "$target.result"
          done < ../../../evidence/selected-tests.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: user-threads-${{ matrix.policy }}
          path: |
            evidence/
            src/threads/build/tests/**/*.output
            src/threads/build/tests/**/*.result
  kernel-threads:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gcc-multilib clang qemu-system-x86
      - run: |
          set -euo pipefail
          mkdir evidence
          git rev-parse HEAD > evidence/commit.txt
          export PATH="$PWD/src/utils:$PATH"
          chmod +x src/utils/pintos*
          make -C src/utils setitimer-helper
          make -C src/threads > evidence/build.txt 2>&1
          cd src/threads/build
          for name in alarm-single alarm-multiple alarm-simultaneous alarm-zero alarm-negative alarm-block; do
            make "tests/threads/$name.result"
            grep -qx PASS "tests/threads/$name.result"
          done
          make tests/threads/prio-transfer.result
          grep -qx PASS tests/threads/prio-transfer.result
          for name in alarm-priority priority-change priority-donate-one priority-donate-multiple priority-donate-multiple2 priority-donate-nest priority-donate-sema priority-donate-lower priority-fifo priority-preempt priority-sema priority-condvar priority-donate-chain priority-starve priority-starve-sema st-matmul mt-matmul-2 mt-matmul-4 mt-matmul-16; do
            make "tests/threads/$name.result"
            grep -qx PASS "tests/threads/$name.result"
          done
          for policy in fifo prio; do
            mkdir -p "../../../evidence/user-sync-$policy"
            for name in lock-simple lock-init-fail lock-dbl-acq lock-dbl-rel lock-acq-fail sema-simple sema-init-fail sema-up-fail sync-bound; do
              target="tests/userprog/multithreading/$name"
              rm -f "$target.output" "$target.result"
              make KERNELFLAGS="-sched=$policy" "$target.result"
              grep -qx PASS "$target.result"
              cp "$target.output" "$target.result" "../../../evidence/user-sync-$policy/"
            done
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: threads-priority-evidence
          path: |
            evidence/
            src/threads/build/tests/**/*.output
            src/threads/build/tests/**/*.result
  userprog-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gcc-multilib clang qemu-system-x86
      - run: |
          set -euo pipefail
          mkdir evidence
          git rev-parse HEAD > evidence/commit.txt
          export PATH="$PWD/src/utils:$PATH"
          chmod +x src/utils/pintos*
          make -C src/utils setitimer-helper
          make -C src/userprog > evidence/build.txt 2>&1
          cd src/userprog/build
          make check 2>&1 | tee ../../../evidence/full-suite.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: threads-userprog-regression
          path: |
            evidence/
            src/userprog/build/tests/**/*.output
            src/userprog/build/tests/**/*.result
