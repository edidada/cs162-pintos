name: CS162 Project2 Threads
on:
  push:
    branches: [edidada/proj-threads]
  workflow_dispatch:
jobs:
  concept-negative-control:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gcc-multilib clang qemu-system-x86
      - run: |
          set -euo pipefail
          mkdir evidence
          git rev-parse HEAD > evidence/commit.txt
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/threads/synch.c')
          s = p.read_text()
          marker = 'void sema_up(struct semaphore* sema) {'
          comparator = '''static bool base_priority_less(const struct list_elem* a, const struct list_elem* b,
                                         void* aux UNUSED) {
            return list_entry(a, struct thread, elem)->base_priority <
                   list_entry(b, struct thread, elem)->base_priority;
          }
          '''
          assert s.count(marker) == 1
          s = s.replace(marker, comparator + marker)
          old = 'list_max(&sema->waiters, thread_priority_less, NULL)'
          assert s.count(old) == 1
          s = s.replace(old, 'list_max(&sema->waiters, base_priority_less, NULL)')
          p.write_text(s)
          PY
          git diff -- src/threads/synch.c > evidence/mutation.patch
          export PATH="$PWD/src/utils:$PATH"
          chmod +x src/utils/pintos*
          make -C src/utils setitimer-helper
          make -C src/threads > evidence/build.txt 2>&1
          cd src/threads/build
          make tests/threads/priority-donate-sema.output
          perl -I../.. ../../tests/threads/priority-donate-sema.ck tests/threads/priority-donate-sema tests/threads/priority-donate-sema.result
          grep -q '^FAIL' tests/threads/priority-donate-sema.result
          grep -q 'Thread M finished' tests/threads/priority-donate-sema.output
          if grep -q 'Thread L downed semaphore' tests/threads/priority-donate-sema.output; then exit 1; fi
          echo 'Original checker rejects semaphore selection by base priority' > ../../../evidence/negative-control.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: threads-concept-negative-control
          path: |
            evidence/
            src/threads/build/tests/threads/priority-donate-sema.output
            src/threads/build/tests/threads/priority-donate-sema.result
  user-threads:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        policy: [fifo, prio]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gcc-multilib clang qemu-system-x86
      - run: |
          set -euo pipefail
          mkdir evidence
          git rev-parse HEAD > evidence/commit.txt
          export PATH="$PWD/src/utils:$PATH"
          chmod +x src/utils/pintos*
          make -C src/utils setitimer-helper
          make -C src/threads > evidence/build.txt 2>&1
          python3 - <<'PY' > evidence/selected-tests.txt
          from pathlib import Path
          for line in Path('src/tests/userprog/multithreading/Make.tests').read_text().splitlines():
              if line.startswith('tests/userprog/multithreading_TESTS '):
                  print(line.split('=', 1)[1].strip())
          PY
          cd src/threads/build
          while read -r target; do
            make KERNELFLAGS="-sched=${{ matrix.policy }}" "$target.result"
            grep -qx PASS "$target.result"
          done < ../../../evidence/selected-tests.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: user-threads-${{ matrix.policy }}
          path: |
            evidence/
            src/threads/build/tests/**/*.output
            src/threads/build/tests/**/*.result
  kernel-threads:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gcc-multilib clang qemu-system-x86
      - run: |
          set -euo pipefail
          mkdir evidence
          git rev-parse HEAD > evidence/commit.txt
          export PATH="$PWD/src/utils:$PATH"
          chmod +x src/utils/pintos*
          make -C src/utils setitimer-helper
          make -C src/threads > evidence/build.txt 2>&1
          cd src/threads/build
          for name in alarm-single alarm-multiple alarm-simultaneous alarm-zero alarm-negative alarm-block; do
            make "tests/threads/$name.result"
            grep -qx PASS "tests/threads/$name.result"
          done
          make tests/threads/prio-transfer.result
          grep -qx PASS tests/threads/prio-transfer.result
          for name in alarm-priority priority-change priority-donate-one priority-donate-multiple priority-donate-multiple2 priority-donate-nest priority-donate-sema priority-donate-lower priority-fifo priority-preempt priority-sema priority-condvar priority-donate-chain priority-starve priority-starve-sema st-matmul mt-matmul-2 mt-matmul-4 mt-matmul-16; do
            make "tests/threads/$name.result"
            grep -qx PASS "tests/threads/$name.result"
          done
          for policy in fifo prio; do
            mkdir -p "../../../evidence/user-sync-$policy"
            for name in lock-simple lock-init-fail lock-dbl-acq lock-dbl-rel lock-acq-fail sema-simple sema-init-fail sema-up-fail sync-bound; do
              target="tests/userprog/multithreading/$name"
              rm -f "$target.output" "$target.result"
              make KERNELFLAGS="-sched=$policy" "$target.result"
              grep -qx PASS "$target.result"
              cp "$target.output" "$target.result" "../../../evidence/user-sync-$policy/"
            done
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: threads-priority-evidence
          path: |
            evidence/
            src/threads/build/tests/**/*.output
            src/threads/build/tests/**/*.result
  userprog-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gcc-multilib clang qemu-system-x86
      - run: |
          set -euo pipefail
          mkdir evidence
          git rev-parse HEAD > evidence/commit.txt
          export PATH="$PWD/src/utils:$PATH"
          chmod +x src/utils/pintos*
          make -C src/utils setitimer-helper
          make -C src/userprog > evidence/build.txt 2>&1
          cd src/userprog/build
          make check 2>&1 | tee ../../../evidence/full-suite.txt
          for name in ro-target fork-keep; do
            make "tests/userprog/$name.output"
            perl -I../.. "../../tests/userprog/$name.ck" "tests/userprog/$name" "tests/userprog/$name.result"
            grep -qx PASS "tests/userprog/$name.result"
          done
          pintos -v -k -T 120 --qemu --filesys-size=2 -p tests/userprog/life-parent -a life-parent -p tests/userprog/life-child -a life-child -- -q -f run life-parent > ../../../evidence/lifecycle.txt 2>&1
          grep -q 'LIFECYCLE STRESS PASSED' ../../../evidence/lifecycle.txt
          grep -q 'life-parent: exit(0)' ../../../evidence/lifecycle.txt
          test "$(grep -c 'life-child: exit(9999)' ../../../evidence/lifecycle.txt)" -eq 20
          python3 - <<'PY'
          from pathlib import Path
          import re
          text = Path('../../../evidence/lifecycle.txt').read_text()
          events = [(m.start(), int(m[1])) for m in re.finditer(r'life-child: exit\((\d+)\)', text)]
          parents = [offset for offset, code in events if code not in (73, 9999)]
          leaves = [offset for offset, code in events if code == 9999]
          assert len(parents) == len(leaves) == 20
          assert all(parent < leaf for parent, leaf in zip(parents, leaves))
          print('All 20 middle parents exited before their orphan leaf completed')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: threads-userprog-regression
          path: |
            evidence/
            src/userprog/build/tests/**/*.output
            src/userprog/build/tests/**/*.result

  format-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          set -euo pipefail
          python3 -m venv /tmp/cs162-format
          /tmp/cs162-format/bin/pip install --only-binary=:all: clang-format==18.1.8
          mkdir formatting
          formatter=/tmp/cs162-format/bin/clang-format
          "$formatter" --version | tee formatting/version.txt
          git diff --name-only 8baa8f6f9f5e3071b51b28c1a81f80150128af56 -- '*.c' '*.h' > formatting/files.txt
          while read -r file; do "$formatter" --dry-run --Werror -style=file "$file"; done < formatting/files.txt
          echo 'All task-owned C/H files match clang-format 18.1.8 and src/.clang-format' | tee formatting/result.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: threads-format-check
          path: formatting/
